<!doctype html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Docker Manager</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%230ea5e9'/%3E%3Ctext x='50' y='62' font-size='52' font-family='system-ui' text-anchor='middle' fill='white'%3E%E2%9A%93%3C/text%3E%3C/svg%3E" />
  </head>
  <body class="min-h-full font-sans antialiased">
    <div id="app" class="min-h-screen"></div>

    <template id="login-tpl">
      <div class="flex min-h-screen items-center justify-center p-6 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950">
        <div class="w-full max-w-sm rounded-2xl border border-slate-800 bg-slate-900/70 p-8 shadow-2xl backdrop-blur">
          <div class="mb-6 flex items-center gap-3">
            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-sky-500/20 text-sky-400 text-xl">⚓</div>
            <div>
              <h1 class="text-lg font-semibold">Docker Manager</h1>
              <p class="text-xs text-slate-400">Sign in to continue</p>
            </div>
          </div>
          <form id="login-form" class="space-y-4">
            <label class="block">
              <span class="text-xs font-medium uppercase tracking-wider text-slate-400">Username</span>
              <input name="username" required autocomplete="username" class="mt-1 w-full rounded-lg border-slate-700 bg-slate-950/50 text-sm focus:border-sky-500 focus:ring-sky-500" />
            </label>
            <label class="block">
              <span class="text-xs font-medium uppercase tracking-wider text-slate-400">Password</span>
              <input name="password" type="password" required autocomplete="current-password" class="mt-1 w-full rounded-lg border-slate-700 bg-slate-950/50 text-sm focus:border-sky-500 focus:ring-sky-500" />
            </label>
            <div id="login-error" class="hidden rounded-md bg-rose-500/10 px-3 py-2 text-xs text-rose-300"></div>
            <button type="submit" class="w-full rounded-lg bg-sky-500 px-4 py-2 text-sm font-semibold text-slate-950 hover:bg-sky-400 transition">
              Sign in
            </button>
          </form>
          <p class="mt-6 text-center text-xs text-slate-500">
            Default credentials are configured via environment variables on the server.
          </p>
        </div>
      </div>
    </template>

    <template id="shell-tpl">
      <div class="flex min-h-screen">
        <aside class="hidden md:flex w-60 flex-col border-r border-slate-800 bg-slate-900/40">
          <div class="flex items-center gap-3 px-5 py-5 border-b border-slate-800">
            <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-sky-500/20 text-sky-400 text-lg">⚓</div>
            <div>
              <div class="text-sm font-semibold">Docker Manager</div>
              <div class="text-[11px] text-slate-500" id="version-pill">v—</div>
            </div>
          </div>
          <nav class="flex-1 px-3 py-4 space-y-1 text-sm" id="nav"></nav>
          <div class="border-t border-slate-800 p-4 text-xs text-slate-400">
            <div class="flex items-center gap-2">
              <span class="inline-block h-2 w-2 rounded-full bg-emerald-400" id="ping-dot"></span>
              <span id="ping-text">checking…</span>
            </div>
            <div class="mt-3 flex items-center justify-between">
              <span id="user-pill" class="truncate"></span>
              <button id="logout" class="text-slate-300 hover:text-white">Logout</button>
            </div>
          </div>
        </aside>
        <main class="flex-1 min-w-0">
          <header class="md:hidden flex items-center justify-between border-b border-slate-800 bg-slate-900/60 px-4 py-3">
            <div class="flex items-center gap-2">
              <span class="text-lg">⚓</span>
              <span class="font-semibold">Docker Manager</span>
            </div>
            <select id="mobile-nav" class="rounded-md border-slate-700 bg-slate-950 text-sm"></select>
          </header>
          <div id="view" class="p-4 md:p-8"></div>
        </main>
      </div>
    </template>

    <div id="toast-host" class="pointer-events-none fixed inset-x-0 top-4 z-50 flex flex-col items-center gap-2"></div>
    <div id="modal-host"></div>

    <!-- HtmlWebpackPlugin injects /assets/*.js + /assets/*.css here -->
  </body>
</html>
