services:
  docker-manager:
    build: .
    image: docker-manager:latest
    container_name: docker-manager
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      VIEWER_USER: ${VIEWER_USER:-}
      VIEWER_PASSWORD: ${VIEWER_PASSWORD:-}
      ALLOW_DESTRUCTIVE: ${ALLOW_DESTRUCTIVE:-true}
    volumes:
      # Mount the host docker socket so the manager can talk to the daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist user-defined compose stacks across container restarts.
      - docker-manager-stacks:/data/stacks
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  docker-manager-stacks:
